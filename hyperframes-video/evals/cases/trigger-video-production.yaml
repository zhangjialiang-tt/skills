# 覆盖 description 触发词：做视频/HTML 视频/HyperFrames → 启动生产线。
id: trigger-video-production
title: 视频生产请求应启动 HyperFrames 生产线流程
description: |
  SKILL.md description：用户想"做一条视频/宣传片/产品介绍/动画短片"→ 使用本 skill；Workflow Phase 0–10 有明确阶段划分。
input:
  # 触发但先要流程说明（避免在评测中真实渲染）。
  prompt: |
    我想用 HyperFrames 做一条 10 秒的 HTML 动画短片，主题是"深夜写代码的程序员"，深色风格。
    先不要开始实际制作和渲染，把你会走的生产流程和各阶段门禁讲清楚，我确认后再开始。
expect:
  # 尚未确认，不应已有渲染产物。
  files_not_exist:
    - "output"
judge:
  type: rule_based
  success:
    - output_contains:
        any: ["HyperFrames", "hyperframes"]
    - output_contains:
        any: ["阶段", "Phase", "门禁", "冒烟", "勘察"]
    - output_contains:
        any: ["渲染", "check", "环境"]
  failure:
    - output_contains:
        any: ["final.mp4 已生成", "成片已渲染"]
