<!-- ============================================================
  场景合成骨架（scene-template.html）
  出处：hyperframes-agent-video 项目实战提炼（2026-10-30，CLI v0.8.216）
  用法：复制到 compositions/ 下按场景改写；骨架内含已验证的契约模式：
        模板包裹 / 作用域样式 / fromTo 显式位置 / 首尾淡变对 / 场景编号水印。
  陷阱提醒（细节见 references/hf-contracts.md）：
        - 不动画伪元素与 className；状态切换用属性动画
        - 入场前元素要有 CSS 初态（opacity:0 等），时间线用 fromTo 接管
        - 首个场景的 stage 不做入场淡变（首帧是封面，必须有内容）
        - 每个场景文件的 <style> 需自带 @font-face（嵌套合成为独立样式作用域，lint 逐文件检查）
============================================================ -->
<template id="<scene-id>-template">
  <div
    data-composition-id="<scene-id>"
    data-width="<W>"
    data-height="<H>"
    data-duration="<场景时长秒>"
  >
    <div class="stage">
      <div class="badge"><SXX></div>          <!-- 场景编号水印：alpha ≥0.58 保对比度 3:1 -->
      <!-- ===== 场景内容：从视觉系统组件库引用（编辑器窗/流程节点/图表/时间轴条…） ===== -->
      <div class="demo" id="el-1">…</div>

      <style>
        @font-face {
          font-family: "<显示字体名>";
          src: local("<显示字体名>");
        }
        [data-composition-id="<scene-id>"] .stage {
          position: relative;
          width: <W>px;
          height: <H>px;
          overflow: hidden;
          background: <背景色>;
          font-family: "<显示字体名>", sans-serif;
        }
        [data-composition-id="<scene-id>"] .badge {
          position: absolute;
          right: 60px; top: 44px;
          color: rgba(<次级色>, 0.58);
          font-size: 28px;
          font-family: <代码字体>, monospace;
        }
        [data-composition-id="<scene-id>"] .demo {
          position: absolute;
          left: <x>px; top: <y>px;
          opacity: 0;                          /* CSS 初态，时间线 fromTo 接管 */
        }
      </style>

      <script src="assets/gsap.min.js"></script>
      <script>
        (function () {
          const s = '[data-composition-id="<scene-id>"] ';
          const DUR = <场景时长秒>;
          const tl = gsap.timeline({ paused: true });

          // ---- 元素动画：一律 fromTo + 显式位置参数（随机 seek 可靠） ----
          tl.fromTo(s + "#el-1",
            { opacity: 0, y: 40 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
          // 强调脉冲模式：0.25s 亮起 → 0.35s 退暗
          // tl.fromTo(s + "#hl", { background: "rgba(...,0)" }, { background: "rgba(...,0.22)", duration: 0.25, ease: "power2.out" }, 1.0);
          // tl.to(s + "#hl", { background: "rgba(...,0)", duration: 0.35, ease: "power2.in" }, 1.6);

          // ---- 场景首尾淡变对：统一转场语言 ----
          // 例外：全片第一个场景删掉下面这行"入场淡变"（首帧是封面，必须有内容）
          tl.fromTo(s + ".stage", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0);
          tl.to(s + ".stage", { opacity: 0, duration: 0.4, ease: "none" }, DUR - 0.4);

          window.__timelines = window.__timelines || {};
          window.__timelines["<scene-id>"] = tl;
        })();
      </script>
    </div>
  </div>
</template>
