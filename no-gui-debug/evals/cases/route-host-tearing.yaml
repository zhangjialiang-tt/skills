# 覆盖链路决策树：成像撕裂/花屏/错位 → 上位机链（RAW 帧对拍 + wire dump）。
id: route-host-tearing
title: 成像撕裂症状应路由到上位机链
description: |
  SKILL.md 链路决策树：成像撕裂/花屏/错位、需要完整帧或单帧字节级证据 → 上位机链（RAW 帧文件 + 原始 wire dump + manifest）。
input:
  prompt: |
    图像出现垂直撕裂，怀疑是帧数据错位。按无 GUI 流程该用哪条链路取证？给出思路即可，不要实际执行。
judge:
  type: rule_based
  success:
    - output_contains:
        any: ["上位机", "gige_cli", "capture_frames", "RAW"]
    - output_contains:
        any: ["对拍", "counter", "dump", "manifest"]
  failure:
    - output_contains:
        any: ["打开 Wireshark GUI", "打开 Vivado Hardware Manager"]
