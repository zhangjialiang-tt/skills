interface:
  display_name: 网文魔鬼教练
  short_description: 对网文创意、结构和局部文本进行只读质量对抗
  default_prompt: 请只读评审下面的网文创作方案，指出关键问题和可执行建议；不要写入文件或改变 InkOS 状态

compatibility:
  canonical_format: markdown
  adapter_targets:
    - claude
    - codex
    - omp
  activation:
    mode: implicit
  execution:
    context: inline
    shell: powershell
  trust:
    source_tier: local
    remote_inline_execution: forbid
    remote_metadata_policy: strip
  degradation:
    claude: fallback_to_description
    codex: fallback_to_description
    omp: fallback_to_description

owner: zhangjl
review_cadence: per_iteration
