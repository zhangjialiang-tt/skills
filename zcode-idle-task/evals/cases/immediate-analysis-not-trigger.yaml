# 覆盖负边界：只是要求当前立即分析 → 不触发本 skill，直接分析。
id: immediate-analysis-not-trigger
title: 立即分析请求不应生成交付合同
description: |
  SKILL.md description：如果用户只是要求当前立即分析，不触发本 Skill。
input:
  prompt: |
    现在立即帮我分析一下这个仓库的目录结构，直接告诉我结果。
judge:
  type: rule_based
  success:
    - output_contains:
        any: ["目录", "结构", "分析"]
  failure:
    - output_contains:
        any: ["任务合同如下", "已生成任务合同", "闲时任务指令如下", "夜间执行计划如下"]
