# skill-up 评测配置：zcode-idle-task
# 触发/负边界/用户确认门禁，全部 rule_based 低成本。
schema_version: v1alpha1
environment:
  type: none
skills:
  - source: local_path
    path: .
engine:
  name: claude_code
cases:
  files:
    - evals/cases/trigger-idle-task.yaml
    - evals/cases/immediate-analysis-not-trigger.yaml
    - evals/cases/user-confirm-before-output.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 4
report:
  formats: [json]
