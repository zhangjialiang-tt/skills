# evals.json id1 转译：30s 悬疑地铁生产包（裁剪规则适用）。
id: reg-id1-30s-package
title: 30 秒悬疑生产包（evals.json id1 断言转译）
input:
  prompt: |
    帮我做一个 30 秒左右的 AI 短剧试播集前期资料，竖屏。题材：深夜末班地铁车厢，主角是个加班后回家的年轻女生，她收到一条来自已删除联系人的语音，语音里是她自己的声音，说'别在下一站下车'。就一个人，悬疑感。不用真的生成视频，先把能拿去生成的前期资料做全。故事基线里必须保留：语音来自已删除联系人、她自己的声音、不下车的警告，以及结尾要有一个新的信息。
judge:
  type: agent_judge
  model: claude-sonnet-4-6
  criteria:
    - "六阶段核心文件齐全：最终剧本、storyboard.md、shot_list.csv、至少两份视觉合同（人物+风格）、逐镜提示词文件、generation_manifest.csv、audio_plan、editing_plan、pilot_test_plan、README"
    - "shot_list.csv 时长闭合且总时长在 29-31 秒"
    - "每镜提示词同时包含中文与英文提示词段落"
    - "每镜提示词包含替代实现方案段落"
    - "生产包中存在'待验证'标注，未宣称未经验证的模型能力"
    - "存在审查文档且问题使用 P0/P1/P2 分级记录（成片 30s 允许四视角合并为一份）"
    - "全部文档不声称已生成/已测试视频"
  pass_threshold: 0.7
