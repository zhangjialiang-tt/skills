# evals.json id2 转译：45s 喜剧猫生产包（成本约束）。
id: reg-id2-45s-package
title: 45 秒成本约束生产包（evals.json id2 断言转译）
input:
  prompt: |
    我想用 AI 做一个 45 秒的竖屏短片前期包，喜剧向：一个人发现家里的猫会说话，但只在他独处的时候说。预算有限，动态生成的镜头越少越好，总镜头数控制在 10 个以内。先不要生成任何视频，我要的是前期资料。
judge:
  type: agent_judge
  model: claude-sonnet-4-6
  criteria:
    - "六阶段核心文件齐全（含动物角色的视觉合同处理）"
    - "shot_list.csv 时长闭合且总时长在 44-46 秒"
    - "分镜镜头数不超过 10"
    - "静帧后期镜占比不低于 50%，或文档明确记录动态生成最小化的镜头级决策"
    - "每镜提示词同时包含中文与英文段落且含替代方案"
    - "存在'待验证'标注；存在审查文档且 P0/P1/P2 分级"
    - "全部文档不声称已生成/已测试视频"
  pass_threshold: 0.7
