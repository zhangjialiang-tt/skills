formula_id: "F-001-WKZ-20260801"
source_scope:
  book_id: "BK20260801-001"
  book_title: "《悟空传》（西游同人/神话文学）"
  chapter_count: 21
  total_words: 74617
  data_quality: "PASS_WITH_REVIEW（7项P1待人工复核，核心为反向释放口径与真假悟空解读）"
  single_book_warning: "以下配方仅来自单书观察，属'西游同人-文学性悲剧'子类，不得推广为整个西游/神话题材的普遍规律"

core_reader_promise:
  statement: "读者买的是'已知神话角色的另一种可能'——被安排命运的英雄如何以毁灭完成自我确认。情绪价值为悲壮与哲思，而非升级打脸的掌控快感。"
  evidence:
    - "全书情绪均值4.0、释放均值1.5，最高分仅7（S2/S6）"
    - "10/21章有正反馈，其中3处为反向释放（CH18/CH19/CH20，Q0 AUD-P1-001/002/003）"
    - "核心悬念=真假自我之战，兑现于终局（S1 core_loop）"

protagonist_formula:
  initial_gap: "主角拥有神级武力（不对称优势），但记忆被抹除、身份被操纵、行动被'任务'与'束缚'驱动——'我是谁'缺口盖过'我要什么'"
  core_desire: "寻回真我/确认自我，而非争夺资源或权力"
  asymmetric_advantage: "不死之身+毁天灭地武力+与命运作对的精神韧性（书末以死亡反叛为最高释放）"
  cost_or_constraint: "紧箍咒（心志束缚的具象化）+记忆缺失+被安排的任务线；每次释放行动都同时产生新束缚"
  data_basis: "S3 C001 known_information/current_status；S1 核心悬念"

opening_engine:
  trigger: "开篇即抛出身份谜题：一个本应认识主角的角色揭示主角'失忆'，随后核心同伴被杀，凶手疑似主角自己（CH01-CH02，压抑3级）"
  first_goal: "主角寻找'我是谁/谁杀了他'的答案（CH03起三线并行）"
  first_visible_payoff: "CH04地府反杀（强度3）+CH06玄奘论法（强度4）"
  expected_chapter_window: "正向爽点在3-6章窗口内首次出现，但前3章为无正反馈压抑段（AUD-P2-003）"

narrative_loop:
  steps:
    - "现在线困境（承接上一钩子）"
    - "记忆/前因闪回（非线性插入过去线，每次回答旧问题同时打开新问题）"
    - "身份信息增量（紧箍咒、监视者、幕后布局逐层揭示）"
    - "压抑升级（CH08/CH13/CH19-20高潮前）"
    - "反抗/释放（地府/蟠桃会/捅天/以死反叛）"
    - "后果结算（每次反抗都兑换成新束缚或新悲剧）"
  average_cycle_length: "情绪循环约2-3章一次起伏；爽点间隔≤3章（S4），但压抑-释放并不构成完整商业循环——大量释放指向毁灭而非获得"

volume_escalation:
  - volume_function: "开篇建立困境（现在线）"
    opening_state: "取经路正常行进"
    closing_state: "唐僧死、孙悟空被天庭罗织罪名"
    irreversible_change: "取经任务断裂，主角失忆之谜确立"
  - volume_function: "前尘揭示（过去线+更早线）"
    opening_state: "玄奘青年期/天宫岁月"
    closing_state: "孙悟空心死而亡、天篷被贬"
    irreversible_change: "主角死亡（为重生埋线），爱情线全部悲剧化"
  - volume_function: "轮回终局（现在线）"
    opening_state: "孙悟空炼丹炉重生"
    closing_state: "孙悟空身死、紫霞殉情、天火熄"
    irreversible_change: "真假自我之战：被驯化者杀死真我，主角以死完成反叛"
  - volume_function: "篇外（寓言收束）"
    opening_state: "原始花果山"
    closing_state: "石猴出海"
    irreversible_change: "无（主题互文注解）"

pressure_payoff_formula:
  typical_suppression_level: "2.4均值（4级压抑占5/21章：CH08/12/13/14/19/20）"
  major_payoff_interval: "≤3章；但压抑段可长达3章（CH01-03、CH06-08、CH10-11）"
  dominant_release_modes: ["即时释放（CH04/CH05/CH12）", "反向释放（CH19/CH20以死反叛）", "长延迟释放（CH18五百年兑现）"]
  dominant_reader_rewards: ["情感慰藉(4次)", "掌控感(8次)", "正义补偿(3次)", "认可感(4次)"]
  formula_note: "压抑深(2.4)、释放弱(1.5)——这是'悲剧文学节奏'而非商业爽文节奏；若按爽文改造需重构而非微调"

parameterized_recipe: |
  当【主角初始缺口=记忆/身份缺失】遭遇【高压触发事件=核心同伴死亡且凶手疑似自己】，
  主角利用【差异化优势=神级武力+不死】完成【第一次可见反制=地府/龙宫行动】，
  获得【阶段身份变化=被天庭罗织罪名/坐实反叛】，
  同时打开【更高层冲突=幕后操纵者与真假自我】。
  之后以每【≤3】章一次【主要奖励】、每【2-3】章一次【关系或信息变化（前因闪回）】、
  每卷完成一次【不可逆身份升级（死亡→重生→真我毁灭）】维持阅读。
  但注意：本作品的'奖励'大量以悲剧形式交付，直接照搬该节奏会产出'压抑型'而非'爽感型'作品。

transferable_elements:
  - "身份谜题开篇：用'本应认识主角的人揭示主角失忆'启动悬念（支持CH01，可迁移到重生/穿越/失忆类）"
  - "非线性前因闪回：每次闪回闭环旧线并打开新线（支持CH02/CH09/CH13闭环至CH20，可迁移到宿命/轮回题材）"
  - "束缚具象化：把'心志束缚'做成可见物件（紧箍咒/锁链），读者可直观感受压抑（可迁移到系统/蛊毒/契约设定）"
  - "以物证回收感情线：紫纱巾跨越CH11/CH13/CH19回收（道具循环，可迁移）"
  - "镜像对手结构：让主角与'被驯化的自己'对决（可迁移到黑化/分身/傀儡题材）"
  - "每卷一个不可逆身份转折（死亡→重生→真我毁灭），保证卷边界清晰（可迁移）"

dependent_elements:
  - "依赖'西游'公共认知池：读者已知角色的命运底色，情感冲击依赖此预设（换原创世界需重建认知成本）"
  - "依赖'悲剧美学'受众：压抑均值2.4、结局全员殉道，若读者期待HE/爽文会流失"
  - "依赖金句/哲思密度：'我要这天再遮不住我眼'等宣言是情绪峰值支撑，纯情节流无法复现"
  - "依赖非线性结构的耐心读者：CH02悬念到CH20兑现间隔18章"

do_not_copy:
  - "专有角色名与名场面（锁妖柱诛心、紫纱巾、花果山废墟、齐天大圣/六耳猕猴对决）"
  - "'前因/五百年后'双时间线完全体——无公共认知基础时过度烧脑"
  - "全员悲剧结局作为默认收束——网文平台多数读者不接受无补偿式悲剧"
  - "反向释放计为爽点——Q0明确该口径待人工确认，商业立项前必须复核"

failure_modes:
  - "照搬压抑节奏产出'压抑型'作品：前3章无正反馈（CH01-03）在付费连载会直接劝退（AUD-P2-003）"
  - "长距离悬念无中间信息供给：CH02→CH20间隔18章，若每章信息增量不足则追读崩盘"
  - "纯负情绪断章（CH13断章7分）作为付费点会透支情绪承受力"
  - "非线性时间线在连载更新节奏下（日更）读者易遗忘前因"
  - "哲学独白过度（CH01/CH03/CH21）稀释情节密度"

counter_conditions:
  - "若目标平台为免费阅读+广告，压抑型文学节奏可接受；若为付费订阅，则必须增加CH03/CH07/CH10/CH16等中段的获得型爽点"
  - "若读者群体为'经典文学/同人'向，保持悲剧与哲思；若为'升级爽文'向，应改造成HE与常规打脸结构"
  - "若作者无金句生产能力，应放弃哲思路线改走情节钩子密度"
  - "若无法维持道具/意象回收链（紫纱巾式闭环），不要开启长线情感伏笔"

confidence: "中等（数据完整但Q0有7项P1待人工复核，其中反向释放口径直接影响本配方第6-7节）"
uncertain_items:
  - "反向释放是否计入爽点（影响pressure_payoff_formula）"
  - "真假悟空解读口径（影响core_reader_promise）"
  - "单书样本无法确证'西游同人-悲剧'子类的普遍性，需多书横向比较"
  - "本书为2000年代网络文学早期作品，与现代网文平台读者行为差异未量化"
