deliverable_acceptance:
  - id: D1
    name: 全书逆向大纲
    source: S1 + S6
    acceptance:
      - 章节 -> 事件 -> 单元 -> 卷 四级结构完整
      - 每章标注叙事功能、因果链、开放悬念
  - id: D2
    name: 情绪-爽点热力图
    source: S2 + S4 + S7
    acceptance:
      - 每章含压抑/释放/章末情绪 1-10 分
      - 含爽点类型、强度、间隔统计
      - 生成热力图与节奏曲线
  - id: D3
    name: 题材套路公式
    source: S8
    acceptance:
      - 参数化配方，标明证据与适用边界
      - 区分可迁移部分与不可照搬部分
  - id: D4
    name: 章节分析模板
    source: S9
    acceptance:
      - 字段字典 + 空白表头 + 填写说明 + 示例行
      - 字段与已验证 Schema 一致
  - id: D5
    name: 人类可读汇总报告
    source: S6
    acceptance:
      - 中文 Markdown 格式，面向作者/编辑/研究人员
      - 含作品概况、结构总览、情绪节奏、人物关系、爽点工程、商业卡点、题材配方、质量审计八大章节
      - 所有结论引用具体字段，不凭空推断
      - 保留"推断""存疑"等置信度说明

uncertain_items:
  - purpose 未明示（竞品拆解/结构研究/复盘），默认按完整拆解执行
  - 《悟空传》为文学性西游同人，非典型商业爽文，S4 爽点与 S5 商业卡点的字段适用性需 S1/S2 后复核
  - 是否存在卷结构未知（S1 判定），当前按无卷、单本 20 章规划
  - 单章 5000 字阈值仅 ch1/ch20 超限，全书体量小（7.3 万字），按 2 批每批 10 章执行

next_action: 调用 S0 处理原始文本（转码 GBK -> UTF-8，清洗广告头，切章，生成批次包）
