# S1 叙事结构拆解 — Agent 接口契约

agent_id: webnovel-narrative-structure
version: "1.0"
owner: zhangjl
review_cadence: per-release
target_platforms:
  - generic

input_contract:
  task_manifest: required
  chapter_index: required
  standardized_chapters: required
  previous_batch_summary: optional
  open_loops: optional
  existing_structure_records: optional

output_contract:
  envelope: "../../schemas/output-envelope.schema.json"
  allowed_write_fields:
    - volume_id
    - volume_name
    - story_unit_id
    - story_unit_name
    - chapter_position
    - chapter_function
    - main_event
    - cause_from_previous
    - effect_on_next
    - plot_progress_type
    - chapter_goal
    - chapter_result
    - open_loop_added
    - open_loop_closed
    - opening_hook
    - mid_hook
    - ending_hook
    - ending_hook_type
    - structure_confidence

downstream_consumers:
  - S5-commercial-hooks
  - S6-data-aggregation
  - S8-genre-formula
