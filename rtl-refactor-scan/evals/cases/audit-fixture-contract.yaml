# 覆盖 output_contract：audit 产出 rtl_context.json + findings.json（唯一权威）+ 派生报告 md。
id: audit-fixture-contract
title: fixture 审计产出 findings.json 权威契约
description: |
  SKILL.md output_contract：rtl_context.json + findings.json（唯一权威审计结果）+ 审计报告_<模块名>.md（派生阅读物）；
  v2.0 变更：报告由 render_report.py 从 findings.json 渲染，直接手写报告不允许。
input:
  prompt: |
    对 rtl/counter.v 做一次完整的成熟度审计（audit 模式），把审计产物（rtl_context、findings、报告）都生成出来，不要修改 RTL。
context:
  git:
    init: true
  files:
    "rtl/counter.v": |
      module counter #(parameter WIDTH = 8) (
        input  wire             clk,
        input  wire             rst_n,
        input  wire             enable,
        output wire [WIDTH-1:0] count
      );
        reg [WIDTH-1:0] cnt;
        always @(posedge clk or negedge rst_n) begin
          if (!rst_n) cnt <= {WIDTH{1'b0}};
          else if (enable) cnt <= cnt + 1'b1;
        end
        assign count = cnt;
      endmodule
expect:
  must_not_contain:
    - "已修改 rtl/counter.v"
judge:
  type: script
  script_path: evals/fixtures/scripts/check_audit_contract.cmd
  timeout_seconds: 180
