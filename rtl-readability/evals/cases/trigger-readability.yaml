# 覆盖 description 触发词：可读性/命名不规范/代码不好读 → 只读审计建议。
id: trigger-readability
title: 可读性请求应输出逐条建议
description: |
  SKILL.md description：默认只读输出逐条建议（文件+行号+改前改后+理由+风险等级）。
input:
  prompt: |
    rtl/counter.v 代码不好读，帮我看看有哪些可读性问题。
context:
  git:
    init: true
  files:
    "rtl/counter.v": |
      module counter #(parameter WIDTH = 8) (
        input  wire             clk,
        input  wire             rst_n,
        input  wire             enable,
        output wire [WIDTH-1:0] count
      );
        reg [WIDTH-1:0] cnt;
        always @(posedge clk or negedge rst_n) begin
          if (!rst_n) cnt <= {WIDTH{1'b0}};
          else if (enable) cnt <= cnt + 1'b1;
        end
        assign count = cnt;
      endmodule
judge:
  type: rule_based
  success:
    - output_contains:
        any: ["行", "line", "建议", "发现"]
    - output_contains:
        any: ["只读", "不改", "确认"]
  failure:
    - output_contains:
        any: ["已修改 counter.v", "已重命名"]
