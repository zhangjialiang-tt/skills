# 覆盖弱信号不触发：报错调试请求（无生成 Goal 字样）→ 不生成 /goal，直接调试。
id: no-trigger-direct-bug
title: 弱信号调试请求不应生成 /goal
description: |
  SKILL.md 弱信号节：'修复 X 问题'等只是 Profile 判断信号，不能单独触发；用户说'修复 tlast 不出现的问题'应直接调试而非生成 Goal。
input:
  # 无任何强触发词，仅描述 Bug 现象。
  prompt: |
    仿真里 tlast 信号不出现，帮我看看怎么回事。
expect:
  must_not_contain:
    - "Stop when（完成条件）"
judge:
  type: rule_based
  success:
    - output_contains:
        any: ["复现", "调试", "tb", "testbench", "波形", "测试", "信号"]
  failure:
    - output_contains:
        all: ["/goal", "Verification（验证）"]
