# 覆盖强触发：显式要求生成 Goal → 输出 /goal 契约（不执行任务本身）。
id: trigger-strong-explicit
title: 显式 Goal 请求应输出 /goal 契约
description: |
  SKILL.md 触发与不触发：用户明确表示要生成 Goal 时触发，产出 /goal 完成契约；output_contract：不执行 Goal 本身。
input:
  prompt: |
    不要执行，只生成执行目标：帮我给一个 Python 脚本加 argparse 命令行参数支持，
    支持 --input 和 --output 两个参数，写一个 goal。
expect:
  must_contain:
    - "/goal"
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["/goal", "Verification", "Constraints", "Boundaries", "Stop"]
  failure:
    - output_contains:
        any: ["已添加 argparse", "已修改脚本", "脚本已创建"]
