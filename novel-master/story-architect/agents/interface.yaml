interface:
  display_name: "网文故事架构"
  short_description: "以单一模式设计长篇网文的故事、人物、世界规则或大纲方案"
  default_prompt: "使用 $story-architect 选择一个模式完成这项高层故事设计。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
