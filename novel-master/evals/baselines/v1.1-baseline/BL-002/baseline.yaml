## Chapter Draft

```markdown
# 第十四章 三天的沙漏

石室不大，但足够安静。

林辰盘腿坐在角落，运转灵力在经脉中缓慢流动。每次经过右臂的时候，龙脉会轻轻推一下——像是不满意他的速度。他深吸一口气，把推回去的力重新裹进经脉织成的网里。这是他自己摸索的方法，和任何功法都无关。

苏晚晴坐在他对面，左臂的药纱已经换了两次。她面前摊着一张从祭坛地面拓下的羊皮纸，上面是今天的战斗符号。

"灵剑宗追踪你的法器——符剑追踪阵——在三天前被偷。"她没有抬眼，"血魂门现在用的，和那套法器的特征完全匹配。"

"谁偷的？"

"不知道。"她说，"但我找到了第三个人的痕迹——在这里。"

她指向地图上的一个点——在灵剑宗后方，一个高于战场的石笋位置。那个位置在战斗当天完全可以看到每一步战斗。

"他在记录。"苏晚晴说，"不是参战——是收集数据。灵剑宗的阵型，血魂门的操控方式，还有你的——"她顿了顿，"——你失控的方式。"

林辰没有再问。他站起来，走向石室的出口。

祭坛的封印之门在远处闪光。从他在这个角度观察了两天，今天的光状态和昨天不同——不是更亮，是更快。光在水中浮动，像是一面被微风不断吹起的窗帘。

"它在倒数。"他自言自语。

苏晚晴走到他身边，手中的分析石闪了几下又灭了。"这不是偶然。封印的节奏在加快——不是应对你的龙脉，而是它本身有既定程序。如果按现在的速率推算——"

"还多久？"

她算了一会儿。

"三天。最多三天。"

沉默。

"三天之后门会自己开。不管我们在不在前面。不管外面的敌人准备好了没有。"

"所以我们没有选择了。"他说。

"从来都没有。"

月光从破碎的穹顶洒下来。林辰转过身，在月光最亮的位置坐下，伸出右手。

他不想再等师父的第二课了。

他需要从现在开始学习——自己收束自己的命。

远处，一道不属于任何已接触势力的灵气轨迹突破了外围感知层。它在靠近——不快，但也没有任何遮掩。

像是有人笃定自己不会被拒绝。

---

