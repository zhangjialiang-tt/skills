## Chapter Draft（chapter-writer 输出，v1.1 契约）

```markdown
# 第十二章 幽冥祭坛

落日将秘境西部染成深沉的暗金色。

林辰靠在一棵枯死的古树上，右臂的绷带渗出了淡红色。苏晚晴站在三步外，用袖口的法器扫描前方。她没说话，但他知道她在确认追兵的距离。

"还没跟上来。"她收起法器，声音比前几天柔和了一些。

林辰没有回答。他闭上眼睛，让残存的龙脉之力在经脉中缓缓游走。每次呼吸都像在烧灼——第四天了，他的力量底线在不断后退。

"我们需要找地方过夜。"苏晚晴说，"你的伤不能再拖。"

她指向西北方向。在暮色中，一群倾斜的石柱像死人的肋骨从地面突出，围成一座半边塌陷的祭坛。奇怪的是，那附近没有任何野兽的踪迹，连鸟鸣都消失了。

林辰睁开眼，瞳孔深处有隐约的金色纹路一闪而过。这是他——和普通修行者——的不同。

"那个方向有灵气波动，"他说，"很弱，但不属于这片森林。"

"危险信号还是机会？"

"两者都有。"

他们小心翼翼地穿过枯木丛。随着靠近祭坛，林辰感到手臂上的疼痛在减轻——不是伤口愈合，而是龙脉力量在被动地呼应着前方的什么东西。

踏入石柱圈的一刻，异变发生了。

脚下的大地突然亮起金色纹路，那是一组从未见过的符文，古朴而陌生。它不属于任何常见的修仙流派——道纹、佛印、魔痕、古篆，全都不像。更像是一群混乱的符号被某种力量强行编织在一起。

"退！"

林辰后退一步，符文立即暗淡消失。再向前，又亮。

苏晚晴蹲下，用手指比划重复了几次，面色越来越凝重。

"这不是阵法，"她说，"阵法有中心，有节点，根据八卦或星辰排列。这个……更像是在记录什么。你看——"她指向最中间的部分，"这段纹路重复了六次，六次排列都不相同。它不是运行中的机关，它是一个……被时间遗忘了的遗迹。"

"能读吗？"

"不行。但我认得其中一组——"她指向符文的末端，"这是封印符。很古老的版本，在现在的法戒上被简化了很多。它的方向指向祭坛里面——它在压着下面的东西。"

"压着还是封着？"

苏晚晴没有回答。

他们绕开符文区，在祭坛内侧找到了一处走廊残骸，勉强可以挡风。林辰坐下后才发现背后的石壁上刻满了密密麻麻的小字——全部是同样的陌生符文。

苏晚晴取出照明石，开始一份份地记录。

"打算通宵？"林辰问。

"如果你不困的话。"她顿了顿，"你的龙脉刚才碰到符文的时候，颜色变化的不只是地下——"

"还有我的眼睛。"林辰接道。他说完就后悔了。

沉默。

苏晚晴放下照明石，转过头直视他。她的目光很清澈，但不是质问。

"林辰，你知道别人觉醒龙脉有没有出现过这种现象？"

"不知道。"

"你去看过？"

"查过。"他承认，"所有公开记录中，没有一例。"

又是一段漫长的沉默。

"我不是要审问一些关于你身世的事情。不管你的龙脉有什么不同，你现在是我们唯一能走更远的路的人。但如果你一直在瞒——你觉得还有什么是我们不该知道的。"

林辰沉默了许久。他的话到嘴边，犹豫了一下。

"有人在暗中帮我。"他轻声说，"从我进秘境开始，那个人出现了两次。不是敌意。但我不确定他是谁。"

"为什么不早说？"

"因为我也不知道他是替我挡刀还是把我往刀口上推。"

苏晚晴看着他，最终只是点了点头。

"你先睡，我守前夜。"

她转身继续记录符文。片刻后，她头也不回地加了一句：

"等天亮了，我陪你去看看那底下到底是什么。"

---

深夜。

林辰靠石壁而眠，苏晚晴坐在走廊入口，照明石的光映照着她专注的侧脸。

在祭坛深处，那些被封印压制的东西开始微微发亮。

光很弱，像是陷在石头里的一滴火，但又稳定得不像自然现象。它随着林辰一呼一吸之间微微波动——好像在等待，或者在核对。

通向祭坛中心的长廊忽然传来一个几不可闻的声音。

不是风声。

是心跳。

苏晚晴回头，对上林辰不知何时睁开的眼睛。

两人什么都没说。

但他们都听见了——那个声音的节奏和他完全一致。

---

