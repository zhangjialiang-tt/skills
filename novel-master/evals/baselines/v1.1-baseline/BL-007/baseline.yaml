## Chapter Draft

```markdown
# 第二十一章 平原上的第一颗星

秘境与外界之间的过渡地带风很大。

忘川平原不是平的——它是一片微微弯曲的丘陵地貌，草地开始取代秘境中的石质地面。最远的山峦呈现出不自然的紫蓝色，不是日落的原因——是这个世界的物理规律与秘境不同。

林辰和苏晚晴在第一片高地上驻足。

"空气不一样了。"苏晚晴说，"灵气结构的律动——比秘境内慢了至少三成。"

"意味着这里的修行者需要在同一个境界花更多时间。"

"或者他们的力量更精纯。"

林辰没有回答。他的龙血在缓慢回应新环境的灵气结构——稳定的金色波浪，没有共振，没有失控。这让他感到一种这几日从未有过的东西——安宁。

---

天黑得很快。平原没有树木，只有漫天的星。苏晚晴生了火，她没有问林辰任何计划性的问题。

"你觉得你变了吗？"她突然问。

林辰没有马上回答。星空很干净，像一层被打磨过的玻璃。

"在祭坛的第一天，我只想逃。从灵剑宗。从血魂门。从我师父可能还活着的消息。从龙脉。什么都在逃。"

"现在不是了。"

"现在——"他低下头，"想着守住。想着为什么那个老人说'守住'而不是'战胜'。可能他活了太久，知道对抗是会消耗的——守住是更长久的事。"

苏晚晴许久没说话。当她说话时，声音里有某种林辰从未听过的柔软。

"我找了你十一天。真正找到的不是龙血——是你选择守门的那一刻。我以为我找的是一个能力者。你不是能力者。"

"那我是什么？"

"你是那个让这个力量有意义的人。"

火光照在她的脸上，林辰第一次从她眼中看到的不是分析或计算——是一种古老的平静。她已经找了三百年，十二代人的重量在她身上。她没有抱怨过，但就在这个篝火旁，那重量变得可见。

他们在这个平原上不是逃亡者。是从一个使命走进了另一个使命。

---

次日清晨，林辰的龙血在平原东侧方向感应到了一个微弱的信号。不是敌人的灵气——是某种不完全的、被遗忘的东西，但和龙血有相同的共振频率。

"忘川以前是什么地方？"他问。

"据记载——是远古守护者的墓地。每一代在卸任后都会回来这里，把龙血残余还给了这片土地。"

"那里可能有另一个传承。"

"或者一个陷阱。"

两人沉默。然后林辰开始收拾行装。

"先去城镇补充资源。如果在路上信号变强——我们再决定。"

苏晚晴点头。他们在晨光中向丘陵的方向走去。远处，第一个城镇的轮廓已经可见。

---

