## Chapter Plan

```yaml
chapter_plan:
  chapter_id: "15"
  chapter_function: "青云阁的第三方观察者在关键时刻选择介入——不是帮助林辰，而是帮助血魂门。这一背叛揭示了青云阁的规则——他们不帮助任何一方，只确保力量平衡。林辰刚获得的信任突然崩塌。"
  viewpoint_character: "林辰"
  time_and_location: "第十日下午，祭坛外围——林辰正被血魂门围攻"
  opening_state:
    protagonist: "林辰体力在中期，龙脉在逐渐可控但仍不稳定。"
    external: "血魂门发动全面进攻，灵剑宗在观望。第三方观察者——青云阁的老者——一直未出手。"
  scenes:
    - scene_id: "15-01"
      goal: "对抗血魂门围攻——林辰接近突破"
      conflict: "血魂门尝试新策略——同时操控十个符文区域强制分隔林辰和苏晚晴"
      action: "林辰凭收束龙脉的能力强行穿过符文障碍——即将突破血魂门首领的最后防线"
      state_change: "林辰即将胜利——但被介入"
      transition: "青云阁的老者动手——封住了林辰的退路"
    - scene_id: "15-02"
      goal: "反转——青云阁并非盟友"
      conflict: "老者解释——守护者必须凭一己之力守住封印。如果守护者弱——他会在场见证替换。如果守护者强——他会在场见证通过。他的任务不是帮忙——是确保封印永远有守门人。"
      action: "林辰被强制退入血魂门的符文区域——但现在他知道这将是一场没有援军的战斗。背叛感变成了力量——如果他可以被所有人抛弃，他也可以不依赖任何人。"
      state_change: "林辰的心理从'有盟友'转为自己独立——无情但不是放弃"
    - scene_id: "15-03"
      goal: "独自突破——在孤立中完成战斗"
      conflict: "灵剑宗趁林辰被孤立时重新加入战斗——短暂的联合让局势更绝望"
      action: "林辰用龙脉收束的方法逆向重构了整个符文地域——将自己和苏晚晴移出包围圈。不是战胜——是在牺牲之前成功撤退。"
      state_change: "一战结束后——林辰的盟友圈被缩减到苏晚晴一个人"
      transition: "夜幕——林辰望着祭坛的封印之门。卷末在前方——必须独自到达。"
  required_elements:
    - "背叛的发生必须有合理逻辑——不能是剧情杀"
    - "背叛不能完全摧毁林辰——须转化成某种力量"
    - "苏晚晴不能同时背叛——读者需要的锚点"
  chapter_climax: "青云阁老者的背叛与理据"
  ending_state:
    protagonist: "被正式宣布为守护者——但孤立无援"
    external: "血魂门和灵剑宗仍在。林辰现在是唯一的守护者——没有人支持他。"
```

