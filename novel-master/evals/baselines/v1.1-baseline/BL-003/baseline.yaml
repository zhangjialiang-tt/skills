## Chapter Draft

```markdown
# 第十三章 血与石

凌晨的空气带着雷电过后的焦味。

苏晚晴用手指在石壁上迅速画了五个方向。五条灵气轨迹，从三条不同的路向祭坛靠拢。

"第一波三分钟。"她说。

林辰站起来。右臂的绷带已经取下，新生的皮肤下隐约能看到流动的金色纹路——那是龙脉，他的力量，他的秘密，也是他的陷阱。

"灵剑宗的人。我认得他们的追踪法诀。"苏晚晴说，"他们跟了你很久？"

"从第十一天开始。换了一套更隐蔽的。"

"那其他两路呢？"

"不认识。但他们的灵气——很冷。"

苏晚晴的脸色变了。"血魂门。你怎么惹上他们的？"

林辰没有回答。他可以解释，但现在已经没有时间。

第一道光刃从石柱后劈来。他侧身躲开，右手抓住袭击者的手腕，借力向前一送——那人摔进符文区域。大地亮起金光。三秒后，一道金色的锁链从地下弹出，把手腕钉在原地。

"你的阵眼。"苏晚晴的法诀同步落下了封印。三把飞剑同时被锁在符文区的三道光芒中。袭击者的表情从凶狠变成了不可置信。

"他们没有做过功课。"林辰说，但手上的警惕没有放松。

"因为做过功课的人已经在看。"苏晚晴指向北方的石峰——在那里，一缕极淡的血雾正在凝结。

---

血魂门来了。

跟灵剑宗不同，他们不是偷袭。他们走得很慢，每一步踩在地上的时候，脚下的符文会退缩。为首的灰袍女子手掌上有银色的纹路，那不是她的力量——是林辰脚下这片祭坛的力量，被她盗取了。

"你研究过这个地方。"林辰说。

"研究了很久。"她说，"但你肯定会更值钱——有人给的价格。"

她挥手，地上的符文突然倒转了方向——原本朝内的变成了朝外，原本压制封印的变成了护住她的。苏晚晴布置的法器被反噬，她的手指瞬间泛白。

林辰冲向灰袍女子。

他不需要花招。他没有时间思考，也没有时间计算。他只知道打近身——她盗取的能量来自于祭坛，而祭坛的力量与他的龙脉有共鸣。

第一拳，银纹炸裂。

第二拳，灰袍女子后退一步，冷笑。"比登记的数据高出半个量级。有意思。"

第三拳挥出时，胸口的烦闷感突然炸开。

金色从皮肤下爆发——不是他引动的，是祭坛回应了他的愤怒。符文的能量穿透了他的右手，从拳头外溢出一道光柱，将他面前的三个石柱和灰袍女子同时击飞。

紧接着是痛。

不是敌人的反击——是他的龙脉在内部反噬他，像一根烧红的铁链在经脉中逆行。

身后传来苏晚晴的闷哼。

他没有看到。但他后来回想的时候记得——从他右拳流出的余光在炸开时，有一个弧线划过了她的左臂。

血从她的袖口渗出，染红了白色的法袍。

"退——所有人都给我退！"

灰袍女子站起来，嘴角有血，眼神却更亮了。"你真的不知道这东西是什么，对吗？"她笑着，"我改变主意了——我不会杀你。我要等着看其他人怎么收场。"

血雾消散。

---

祭坛安静下来了。符文区被破坏了一半，封印的光芒在缓慢恢复。苏晚晴靠石壁坐着，左手自己包扎了一层药纱。

"你应该走。"林辰说。他站在三步外，不敢靠近。

"如果刚才那种事情再发生，我没办法——"

"所以你觉得应该自己一个人扛？"

"这不是扛不扛的问题——"

"对。"她打断他，"这是你是不是怪物的问题。你认为自己是的。"

沉默。

她站起来，用完好的右手把他的脸转向自己。

"林辰，我不走。"

"你没有理由——"

"你也不知道我真来这里是为了什么。"她说着，声音第一次有了不易察觉的颤抖。"这个秘境里有我需要找的东西——不是别人要我找的，是我必须找的。找不到，我比死还不如。"

"什么东西？"

"下次再告诉你。"

一种新的危机感包围了祭坛——不是战斗的紧迫，是某种更深层的规则在改变。封印的光芒从金色变成了暗红，又变回金色——它在某个路径上，向林辰的方向倾泻了更多的能量。

---

