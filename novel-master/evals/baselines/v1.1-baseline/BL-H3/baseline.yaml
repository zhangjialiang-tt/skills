      action: "林辰避开反龙血符文——通过龙脉感知到幕后人物的能量指纹——一股与外秘境灵气完全不同的能量痕迹，冰冷、系统化、像机器写的程序一样精密。首领不在，但他留下了一个不完整的名字——'辰'。不是林辰——是另一个。"
      state_change: "第二条线索闭环——幕后人物确认存在且有名字"
      transition: "离开分舵时被青云阁的使者拦住"
