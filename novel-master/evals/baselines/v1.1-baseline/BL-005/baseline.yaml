## Chapter Draft

```markdown
# 第十六章 界门的另一边

林辰把手按在封印之门上。

这一次他没有用任何灵力推动，只是让手掌静静贴住表面。银色的门面微微波动，像是被他的体温激活了，然后——整个世界变了。

他不在祭坛了。他站在一个没有天空的地方，眼前是一道望不到边际的黑色裂痕。裂痕对面有东西在动——不是生物，更像是空间本身在打颤。一群修士站在他面前，不是敌人，是被选中的人。他们每个人的右手都有金色的纹络——龙血。

一个声音在他脑海里说：这只是记录，不是召唤。看下去。

修士们一个接一个走向裂缝。不是进攻，是站在裂缝前。他们的龙血从体内燃烧出来，在裂缝上织成了一道金色的网。一个人倒下，第二个人替补。第三个人把自己的龙血连到前两个的网上，第四个人把网推得更深。

最后一个修士转身看着他。她能看见他。穿越千年的时间——她看见一个男孩站在门内，龙血在右臂里闪烁。她说了一句话，没有声音，但他的骨头能够感受到意思：

守住。

记忆中止。

林辰跪倒在地。他的龙血在右臂里剧烈震动——不是攻击，是在回应千年前的命令。他听到了封印之门的真相：它不是宝库，它是一道监狱。门那边是虚空侵蚀，一种以规则为核心、不断吞噬物质世界的现象。龙血是唯一能控制它的东西——但不是永远，只是一代人接着一代人。

苏晚晴站在入口。他不知道自己在地上趴了多久。她看到他的表情后，并没有问他怎么了。她只是靠着墙坐下，用一种从未用过的声音说了：

"每隔十年我去一次秘境周边。每次都是一个人。我找的不是机缘——是龙血。当听说有人觉醒龙脉，我一路跟过来。跟了你十一天之后，我知道是你。"

"你一直在找——"

"我家族已经找了三百年。每一代轮到一个人。上一代是我母亲——她在秘境里没有回来。被虚空侵蚀的残余能量反噬。所以我知道——只有龙血可以对抗这种侵蚀。"

"但你不是——"

"没有龙血。我们不是守护者，是观察者。见证者。如果需要，是送出最后一个消息的人。我没有龙血，但我可以帮你守。"

林辰闭上眼睛。他感受到了体内龙血在动——不是剧烈，像是在倾听。在确认他的决定。

"我不想死。"他说。

"没有要求你死。"

"我也不想让别人替我死。"

"那你守好门。我在旁边。"

他站起来。封印之门的银色光芒照在他脸上。二十四小时内门会开。不是被开启——是结界到了衰弱期，需要新的能量注入——他的龙血。

门外传来了兵器声。不是一波——是多方势力同时到位了。

---

