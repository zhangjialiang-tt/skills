## Chapter Plan

```yaml
chapter_plan:
  chapter_id: "17"
  chapter_function: "林辰从大战中重伤归来——身体在恢复，但龙血的损伤超出了任何灵药能治愈的范围。苏晚晴在照顾他的过程中发现龙血损伤在改变林辰——不只是恢复，是进化。但这种进化的代价是什么？"
  viewpoint_character: "苏晚晴（首次以她为主要视角的一章）"
  time_and_location: "第十一日全天——从凌晨到夜晚，祭坛石室内"
  opening_state:
    protagonist: "林辰昏迷，身体在自动修复，但龙血的失控状态在皮下持续变化。"
    companion（视角人物）: "苏晚晴看着林辰倒下后，承担起了照顾的职责。她在观察中发现了某种不自然的改变。"
  scenes:
    - scene_id: "17-01"
      goal: "苏晚晴照顾林辰——发现龙血在体内改造"
      conflict: "医药手段完全无效——灵力、药草、法器都不能影响林辰的伤。苏晚晴取出家族代代传下来的'观察石'——一件能显示龙血持有者状态的法器。石头上显示的画面让她恐惧——龙血在改造林辰的骨头。"
      action: "苏晚晴用观察石反复查看林辰体内变化——记录下一个发现：龙血不是单纯的恢复力量——它在迭代。每一轮恢复后产生的龙骨比以前更强、但也被龙血的残余能量侵蚀得更深。这本质上是一生都有时限的力量——守护者的身体会越来越强，但被侵蚀的部分也会越来越不可逆转。"
      state_change: "苏晚晴获得了守护者代价的更深层理解——不只是生命的消耗，还是改造"
      transition: "林辰醒来——进入对话"
    - scene_id: "17-02"
      goal: "苏晚晴告诉林辰真相——守护者的身体在缓慢地被改变"
      conflict: "林辰接受真相。他问了一个和代价有关的问题——'我能撑多久？'苏晚晴给出不乐观的估计——但如果龙血能受控，侵蚀速度可以减缓。"
      action: "林辰的反应不戏剧化——他只是点了点头。然后他问苏晚晴为什么一直陪着他——不是为了使命感，是'你想过离开吗'。苏晚晴的回应揭开了更深的情感——不是因为使命，是因为她不想了。"
      state_change: "两人的关系的性质发生了根本变化——从使命的绑定变成了更深的选择⏤"
      transition: "夜晚——林辰要求苏晚晴继续观察他，不是为了恐惧，是为了了解"
    - scene_id: "17-03"
      goal: "苏晚晴在夜间观察到龙血的新阶段——林辰在无意识地使用第二课的能力"
      conflict: "沉睡中的林辰体内产生了自主的龙血循环——这是他还没有学会的第二课——自主收束。苏晚晴意识到他不需要师父——在危急时，龙血会自己找到出路。但这个能力在被完全掌握之前是危险的。"
      action: "苏晚晴用观察石记录了整个过程——她看到龙血在他体内形成了一个稳定的收束循环，然后自行熄灭。当林辰醒来，她告诉他——你不需要等师父了。你的龙血会救你。但他也看到了她的恐惧——她知道这种自救是有代价的。"
      state_change: "重要推进——林辰获得了第二课能力的自然觉醒，但代价意识形成新冲突"
```

