# 《废土灯火》— v1.2 规划基线

> 题材：wasteland-lights（生存/建设发动机）
> 生成日期：2026-07-25

## v1.2 典型输出

### 1. story_architecture（STORY）

```yaml
project_id: wasteland-lights
title: 废土灯火

core_theme: "在文明废墟上重建秩序——权力、信任与牺牲"
tone: 灰暗、坚韧、温暖边缘

main_character:
  name: 陈远
  goal: 在废土上建立安全的幸存者聚居地
  arc: 从孤独求生者 → 小团体领袖 → 势力领袖 → 文明重建者

story_structure:
  - phase: 第一卷·灯火初燃
    summary: 建立第一个小型据点，抵御掠夺者和环境威胁
  - phase: 第二卷·势力博弈
    summary: 与其他幸存者势力接触、冲突与联盟
  - phase: 第三卷·文明抉择
    summary: 面对更大威胁，决定废土未来的秩序

conflict_layers:
  - 生存 vs 人性（安全区资源分配）
  - 秩序 vs 自由（规则是否限制幸存者）
  - 信任 vs 效率（扩大势力同时防止背叛）
```

### 2. plot_plan（PLOT）

```yaml
phase: 第一卷·灯火初燃
target_chapters: 45

major_events:
  - chapter_range: CH-001~CH-005
    event: 陈远发现废弃地堡，开始清理改造
  - chapter_range: CH-006~CH-012
    event: 收容第一批幸存者，建立资源分配规则
  - chapter_range: CH-013~CH-022
    event: 第一次掠夺者袭击，陈远组织防御
  - chapter_range: CH-023~CH-032
    event: 发现附近有其他幸存者据点
  - chapter_range: CH-033~CH-045
    event: 两个据点之间的摩擦与合作试探

subplots:
  - 陈远与核心成员的信任建立与背叛
  - 地堡内资源的来源谜团
  - 废土环境异化的真相
```

