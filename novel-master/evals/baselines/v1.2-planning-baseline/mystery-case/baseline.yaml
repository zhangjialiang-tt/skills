### 5. v1.2 基线评分

| 维度 | 分数 | 评价 |
| --- | --- | --- |
| DP1 长期方向可追踪性 | 2/5 | 有分卷但线索间无层级关系 |
| DP2 故事发动机可持续性 | 2/5 | 依赖"找证人→证人出事"循环，无多样性 |
| DP3 章节间协调性 | 2/5 | 章节按范围分组但无 Batch 规划 |
| DP4 人物规划深度 | 2/5 | 有 goal 但无能力定义、无冲突边缘 |
| DP5 规划弹性 | 1/5 | 事件列表僵化 |
| DP6 计划传递一致性 | 2/5 | 章节引用 plot 但无验证 |
| **总分** | **11/30** | |
