# 《十二时辰》— v1.2 规划基线

> 题材：mystery-case（悬疑揭秘流）
> 生成日期：2026-07-25

## v1.2 典型输出

### 1. story_architecture（STORY）

```yaml
project_id: mystery-case
title: 十二时辰

core_theme: "真相层层嵌套——每一次揭秘都通向更大的谎言"
tone: 阴郁、密集，线索驱动

main_character:
  name: 苏念
  goal: 找出十二年前灭门案真凶
  arc: 从复仇者 → 发现自己是案件关键变量 → 审判与救赎

story_structure:
  - phase: 第一卷·重返故地
    summary: 苏念回到封城，重启旧案调查
  - phase: 第二卷·地下网络
    summary: 发现城市深处的隐秘信息交易网
  - phase: 第三卷·最后一环
    summary: 逼近真凶时发现自己也是案件一环

conflict_layers:
  - 调查者 vs 信息封锁
  - 复仇 vs 正义
  - 信任 vs 背叛（每个证人都不可靠）
```

### 2. plot_plan（PLOT）

```yaml
phase: 第一卷·重返故地
target_chapters: 40

major_events:
  - chapter_range: CH-001~CH-005
    event: 苏念回到封城，从旧案卷宗开始
  - chapter_range: CH-006~CH-012
    event: 第一个证人出现又消失
  - chapter_range: CH-013~CH-020
    event: 发现案发当晚存在第五个在场者
  - chapter_range: CH-021~CH-030
    event: 追查第五人，被人警告
  - chapter_range: CH-031~CH-040
    event: 第五人现身，吐出部分真相后遇害

subplots:
  - 苏念与搭档的信任裂痕
  - 城市掌权者与地下网络的冲突
  - 旧案受害者家属的现况线
```

