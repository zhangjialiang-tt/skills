  emotional_arc:
    target: "紧张→对抗→失控后的恐惧→短暂凝聚"
    turning_point: "龙脉失控误伤苏晚晴的瞬间"

  tension_curve:
    type: SPIKE
    description: "灵剑宗→血魂门两次上升，龙脉失控处达到最高点后短降"

  continuation_drive:
    type: DANGER
    description: "血魂门首领撤退但留下宣言'有人在等'——威胁从秘境层面升级为外部势力"

contract_meta:
  schema_id: "novel-master/chapter-plan"
  schema_version: "1.2.0"
```

