# v1.2 样本：BL-004 — Chapter Plan + Report + Reviewer

> task_id: BL-004 | chapter_role: PAYOFF | EMOTIONAL
> v1.2 新增：reader_experience、target_execution、dimension_results

## Chapter Plan（含 reader_experience）

```yaml
reader_experience:
  chapter_role:
    primary: PAYOFF
    secondary: [REVEAL, EMOTIONAL]
    description: "兑现 FS-005 神秘帮助者身份、FS-003 龙脉来源部分真相，以师父现身和传功为核心的情感兑现章"

  promise: "师父现出真身并揭示龙脉来源——一个无脉的七岁孩子因师徒之情被远古龙血所救。本章的情感兑现必须克制、不用煽情手段，通过细节和记忆片段传达三年牺牲的重量。"

  payoff:
    mode: FULL
    description: "神秘帮助者身份完全兑现、龙脉来源揭示、第一课控制方法传授、师父守护封印之门的真相公布"
    expected_payoff_window: null

  emotional_arc:
    target: "愤怒（三年等待）→ 理解（师父的牺牲）→ 悲伤（再次离别）→ 宁静（承担使命）"
    turning_point: "师父揭示龙脉真相——无脉的孩子因师徒之情活了下来"

  tension_curve:
    type: RELEASE
    description: "从前期章节的高张力战斗转入情感解决章，在师父的回忆中张力释放，结尾以新威胁重新建立低度紧张"

  continuation_drive:
    type: EMOTIONAL
    description: "师父消失在封印之门中、'你是我唯一的传人'——情感牵引同时建立了守护者传承的长期使命"

contract_meta:
  schema_id: "novel-master/chapter-plan"
  schema_version: "1.2.0"
```

