interface:
  display_name: "网文项目简报"
  short_description: "将模糊创意整理为可确认、可执行的长篇网文项目简报文档"
  default_prompt: "使用 $novel-brief 将我的创意整理成可确认的项目简报。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
