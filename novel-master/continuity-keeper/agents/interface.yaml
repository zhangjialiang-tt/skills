interface:
  display_name: "网文连续性管理"
  short_description: "管理长篇网文事实、时间线、上下文提取与正式状态提交流程"
  default_prompt: "使用 $continuity-keeper 检查连续性并执行所需的上下文或状态操作。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
