interface:
  display_name: "网文文本评审"
  short_description: "基于文本证据只读诊断长篇网文并给出可执行的修订建议"
  default_prompt: "使用 $novel-reviewer 只读评审这段正文并给出证据化建议。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
