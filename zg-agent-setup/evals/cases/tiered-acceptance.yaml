# 覆盖「做分级验收」行为。
id: tiered-acceptance
title: 接入后应做分级验收
description: |
  SKILL.md description：维护忽略规则、做分级验收。
input:
  prompt: |
    zg 已经接到工程里了，接下来怎么验收它工作正常？
judge:
  type: rule_based
  success:
    - output_contains:
        any: ["验收", "分级"]
    - output_contains:
        any: ["检索", "搜索", "index", "索引"]
  failure:
    - output_contains:
        any: ["不需要验收"]
